<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">

  <div class="card shadow mb-5">
    <div class="card-header bg-primary text-white"><h2 class="text-center mb-0">Student Registration Form</h2></div>
    <div class="card-body">
      <div class="alert alert-info" role="alert">Please enter all student details carefully.</div>
      <form id="studentForm">
        <div class="row mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Student Name</label>
            <input type="text" class="form-control" placeholder="Enter student name" required>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Roll Number</label>
            <input type="text" class="form-control" placeholder="Enter roll number" required>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Date of Birth</label>
            <input type="date" class="form-control" required>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
              <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
              <label class="form-check-label" for="female">Female</label>
            </div>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Branch</label>
            <select class="form-select" required>
              <option value="">Select Branch</option>
              <option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Year</label>
            <select class="form-select" required>
              <option value="">Select Year</option>
              <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
            </select>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="example@gmail.com" required>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" placeholder="Enter mobile number" required>
          </div>
        </div>
        <label class="form-label">Address</label>
        <textarea class="form-control mb-3" rows="4" placeholder="Enter address" required></textarea>
        <div class="text-center">
          <button type="submit" class="btn btn-primary me-2">Submit</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow">
    <div class="card-header bg-dark text-white"><h2 class="text-center mb-0">Student Information</h2></div>
    <div class="card-body">
      <div class="alert alert-success" role="alert">Student marks and results are displayed below.</div>
      <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover">
          <thead class="table-dark">
            <tr><th>Roll Number</th><th>Name</th><th>Branch</th><th>Marks</th><th>Percentage</th><th>Result</th></tr>
          </thead>
          <tbody>
            <tr class="table-success"><td>101</td><td>Ravi</td><td>CSE</td><td>450</td><td>90%</td><td>Pass</td></tr>
            <tr class="table-success"><td>102</td><td>Priya</td><td>ECE</td><td>420</td><td>84%</td><td>Pass</td></tr>
            <tr class="table-success"><td>103</td><td>Kiran</td><td>EEE</td><td>390</td><td>78%</td><td>Pass</td></tr>
            <tr class="table-danger"><td>104</td><td>Arjun</td><td>CIVIL</td><td>220</td><td>44%</td><td>Fail</td></tr>
            <tr class="table-danger"><td>105</td><td>Sneha</td><td>MECH</td><td>180</td><td>36%</td><td>Fail</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
<script>
document.getElementById("studentForm").addEventListener("submit", function (e) {
  e.preventDefault();
  alert("Student registration submitted successfully!");
});
</script>
</body>
</html>
