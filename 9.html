
<!DOCTYPE html>
<html lang="en" ng-app="studentApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Application</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
</head>

<body>

    <h1>Student Information Application</h1>

    <nav>
        <a href="#!/">Home</a> |
        <a href="#!/students">Student List</a> |
        <a href="#!/login">Login</a>
    </nav>

    <hr>

    <div ng-view>
        Loading application...
    </div>

    <script>
        (function () {
            if (!window.angular) {
                document.querySelector('[ng-view]').innerHTML =
                    "AngularJS failed to load. Check your internet connection.";
                return;
            }

            if (!window.angular.module) {
                return;
            }

            var app;

            try {
                app = angular.module("studentApp", ["ngRoute"]);
            } catch (e) {
                document.querySelector('[ng-view]').innerHTML =
                    "Application initialization failed.";
                return;
            }

            app.config(function ($routeProvider) {
                $routeProvider
                    .when("/", {
                        template: `
                            <h2>Home</h2>
                            <p>Welcome to Student Information Application.</p>
                        `
                    })
                    .when("/students", {
                        template: `
                            <h2>Student List</h2>
                            <ul>
                                <li ng-repeat="s in students">
                                    <a ng-href="#!/students/{{s.id}}">
                                        {{s.name}} - {{s.branch}}
                                    </a>
                                </li>
                            </ul>
                        `,
                        controller: "ListCtrl"
                    })
                    .when("/students/:id", {
                        template: `
                            <h2>Student Details</h2>
                            <div ng-if="student">
                                <p>ID: {{student.id}}</p>
                                <p>Name: {{student.name}}</p>
                                <p>Branch: {{student.branch}}</p>
                            </div>
                            <p ng-if="!student">Student not found.</p>
                        `,
                        controller: "DetailCtrl"
                    })
                    .when("/login", {
                        template: `
                            <h2>Login</h2>
                            <form ng-submit="login()">
                                <input type="text"
                                       ng-model="username"
                                       placeholder="Username"
                                       required>
                                <br><br>

                                <input type="password"
                                       ng-model="password"
                                       placeholder="Password"
                                       required>
                                <br><br>

                                <button type="submit">Login</button>
                            </form>
                            <p>{{message}}</p>
                        `,
                        controller: "LoginCtrl"
                    })
                    .otherwise({
                        redirectTo: "/"
                    });
            });

            app.service("StudentService", function () {
                var students = [
                    { id: 1, name: "Anu", branch: "CSE" },
                    { id: 2, name: "Ravi", branch: "IT" },
                    { id: 3, name: "Kiran", branch: "ECE" }
                ];

                this.getAll = function () {
                    return students;
                };

                this.getById = function (id) {
                    return students.find(function (s) {
                        return s.id == id;
                    });
                };
            });

            app.controller("ListCtrl", function ($scope, StudentService) {
                $scope.students = StudentService.getAll();
            });

            app.controller("DetailCtrl", function (
                $scope, $routeParams, StudentService
            ) {
                $scope.student = StudentService.getById($routeParams.id);
            });

            app.controller("LoginCtrl", function ($scope) {
                $scope.login = function () {
                    $scope.message = "Login successful";
                };
            });
        })();
    </script>

</body>
</html>
